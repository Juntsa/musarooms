/* ====================  jaettava tiedosto  ===============================
   Koneeseen raahatut biisit ovat blob:-osoitteita, jotka elävät vain tässä
   välilehdessä. Jaettavaa varten äänet leivotaan tiedoston sisään
   data-osoitteina, jolloin yksi html on koko jukeboksi.

   Base64 kasvattaa koon noin kolmanneksella, joten tämä sopii muutamalle
   biisille. Koko katalogi kuuluu palvelimelle, jolloin paketin aani-kenttiin
   tulee suorat osoitteet eikä mitään tarvitse upottaa.                      */

const JAKO_RAJA = 160 * 1024 * 1024;        // selain ei jaksa paljon enempää

function blobDataksi(url){
  return fetch(url).then(r => r.blob()).then(bl => new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = rej;
    fr.readAsDataURL(bl);
  }));
}

async function vieJaettava(){
  const mukaan = [];
  for (let i = 0; i < PAIKKOJA; i++){
    const b = BIISIT[i];
    if (b && b.nimi) mukaan.push({ i: i, b: b });
  }
  if (!mukaan.length){
    $('nyt').textContent = 'there are no tracks to share';
    return;
  }

  $('jaa').disabled = true;
  $('nyt').textContent = 'building the shareable file\u2026';
  const data = [];
  let koko = 0;
  try {
    for (let k = 0; k < mukaan.length; k++){
      const { i, b } = mukaan[k];
      let aani = b.aani || '';
      if (aani.startsWith('blob:')){
        $('nyt').textContent = 'upotetaan ' + (k + 1) + ' / ' + mukaan.length + ' — ' + b.nimi;
        aani = await blobDataksi(aani);
      }
      koko += aani.length;
      if (koko > JAKO_RAJA){
        $('nyt').textContent = 'too much audio for one file (' +
          (koko / 1048576).toFixed(0) + ' MB) \u2014 export fewer tracks or move them to a server';
        $('jaa').disabled = false;
        return;
      }
      data.push({ paikka: i + 1, nimi: b.nimi, esittaja: b.esittaja || '', aani: aani });
    }
  } catch (err){
    $('nyt').textContent = 'embedding the audio failed: ' + err.message;
    $('jaa').disabled = false;
    return;
  }

  /* Sivusta otetaan kopio, ruudukko tyhjennetään (se rakennetaan uudelleen
     latauksessa) ja biisit pujotetaan headiin, jotta ne ovat olemassa jo
     ennen kuin sovelluksen oma skripti ajetaan. */
  const kopio = document.documentElement.cloneNode(true);
  const r = kopio.querySelector('#ruudukko'); if (r) r.innerHTML = '';
  const pnl = kopio.querySelector('#paikat'); if (pnl) pnl.classList.add('piilossa');
  const nyt = kopio.querySelector('#nyt'); if (nyt) nyt.textContent = 'ei valintaa';
  /* Jakonappi jää paikalleen. Jos sen poistaisi, skriptin kuuntelija osuisi
     tyhjään ja virhe keskeyttäisi latauksen ennen kuin biisit otetaan
     käyttöön — ja vastaanottaja saisi tyhjän koneen. */

  let html = '<!DOCTYPE html>\n' + kopio.outerHTML;
  const pala = '<scr' + 'ipt>window.JB_UPOTETUT=' + JSON.stringify(data) + ';</scr' + 'ipt>\n';
  html = html.replace('</head>', pala + '</head>');

  const blob = new Blob([html], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'JB-2400_jukeboksi.html';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);

  $('jaa').disabled = false;
  $('nyt').textContent = 'shareable file ready \u00b7 ' + data.length + ' tracks \u00b7 ' +
    (blob.size / 1048576).toFixed(1) + ' MB';
}

$('jaa').addEventListener('click', vieJaettava);

/* Upotetut biisit latauksessa. */
function lataaUpotetut(lista){
  for (let i = 0; i < PAIKKOJA; i++) BIISIT[i] = null;
  mallilista = false;
  for (const r of lista){
    const i = (r.paikka || 0) - 1;
    if (i < 0 || i >= PAIKKOJA) continue;
    BIISIT[i] = { nimi: r.nimi, esittaja: r.esittaja || 'KJWhispers',
                  aani: r.aani || '', tiedosto: '', tunnus: 'upotettu:' + i };
  }
  ladattu = BIISIT.filter(b => b && b.nimi).length;
}

/* ====================  24 paikan raahauspaneeli  ======================== */

const AANI_PAATE = /\.(mp3|wav|m4a|ogg|oga|flac|aac)$/i;
const onAani = f => (f.type && f.type.startsWith('audio/')) || AANI_PAATE.test(f.name);

/* Ensimmäinen oma tiedosto korvaa mallilistan kokonaan. */
function varmistaOmaLista(){
  if (!mallilista) return;
  for (let i = 0; i < PAIKKOJA; i++) BIISIT[i] = null;
  mallilista = false;
}

function asetaPaikka(n, f){
  if (n < 0 || n >= PAIKKOJA || !f) return false;
  varmistaOmaLista();
  if (BIISIT[n] && BIISIT[n].aani && BIISIT[n].aani.startsWith('blob:')){
    try { URL.revokeObjectURL(BIISIT[n].aani); } catch(e){}
  }
  BIISIT[n] = {
    nimi: f.name.replace(/\.[^.]+$/, '').replace(/^\d+[\s._-]+/, ''),
    esittaja: 'KJWhispers',
    aani: URL.createObjectURL(f),
    tiedosto: f.name,
    tunnus: tunnus(f)
  };
  return true;
}

function tyhjennaPaikka(n){
  if (!BIISIT[n]) return;
  if (BIISIT[n].aani && BIISIT[n].aani.startsWith('blob:')){
    try { URL.revokeObjectURL(BIISIT[n].aani); } catch(e){}
  }
  BIISIT[n] = null;
  if (S.valittu === n){
    S.valittu = -1; S.soi = false;
    if (el){ try { el.pause(); } catch(e){} }
  }
}

function paikatMuuttui(viesti){
  ladattu = BIISIT.filter(b => b && b.nimi).length;
  paivitaRuudukko();
  $('nyt').textContent = viesti || (ladattu + ' / ' + PAIKKOJA + ' slots filled');
}

/* Pudotus soluun n. Useampi tiedosto täyttää siitä eteenpäin. */
function pudota(n, tiedostot){
  const fs = Array.from(tiedostot).filter(onAani)
    .sort((a, b) => a.name.localeCompare(b.name, 'fi', { numeric: true }));
  if (!fs.length){
    $('nyt').textContent = 'audio files only (mp3, wav, m4a, ogg, flac)';
    return;
  }
  let i = n, asetettu = 0, yli = 0;
  for (const f of fs){
    if (i >= PAIKKOJA){ yli++; continue; }
    if (asetaPaikka(i, f)) asetettu++;
    i++;
  }
  aanetKayntiin();
  ladattu = BIISIT.filter(b => b && b.nimi).length;
  paikatMuuttui('slot ' + (n + 1) + ' loaded with ' + asetettu +
    (yli ? ' \u00b7 ' + yli + ' did not fit' : '') + ' \u00b7 ' + ladattu + ' / ' + PAIKKOJA);
}

function paivitaRuudukko(){
  const r = $('ruudukko');
  for (let n = 0; n < PAIKKOJA; n++){
    const solu = r.children[n];
    if (!solu) continue;
    const b = BIISIT[n];
    const nimetty = !!(b && b.nimi);
    const soiva = nimetty && !!b.aani;
    solu.classList.toggle('taysi', soiva);
    solu.classList.toggle('vajaa', nimetty && !soiva);
    solu.classList.toggle('tyhja', !nimetty);
    solu.querySelector('.nimi').textContent = nimetty ? b.nimi : 'empty';
    solu.title = soiva ? (b.tiedosto || b.nimi)
      : nimetty ? 'name is set, audio file missing \u2014 drag it here'
                : 'drag a file here';
  }
}

(function rakennaRuudukko(){
  const r = $('ruudukko');
  for (let n = 0; n < PAIKKOJA; n++){
    const d = document.createElement('div');
    d.className = 'solu tyhja';
    d.dataset.n = n;
    d.innerHTML = '<span class="nro">' + (n + 1) + '</span>' +
                  '<span class="nimi">tyhjä</span>' +
                  '<button class="x" title="clear this slot">\u00d7</button>';

    d.addEventListener('dragover', e => { e.preventDefault(); d.classList.add('yli'); });
    d.addEventListener('dragenter', e => { e.preventDefault(); d.classList.add('yli'); });
    d.addEventListener('dragleave', () => d.classList.remove('yli'));
    d.addEventListener('drop', e => {
      e.preventDefault(); e.stopPropagation();
      d.classList.remove('yli');
      pudota(n, e.dataTransfer.files);
    });
    d.addEventListener('click', e => {
      if (e.target.classList.contains('x')){
        tyhjennaPaikka(n);
        paikatMuuttui('slot ' + (n + 1) + ' cleared \u00b7 ' +
          BIISIT.filter(b => b && b.nimi).length + ' / ' + PAIKKOJA);
        return;
      }
      soluValinta = n;
      $('soluTiedosto').click();
    });
    r.appendChild(d);
  }
})();

let soluValinta = -1;
$('soluTiedosto').addEventListener('change', e => {
  if (soluValinta >= 0 && e.target.files.length) pudota(soluValinta, e.target.files);
  soluValinta = -1;
  e.target.value = '';
});

/* Pudotus paneelin taustalle: täyttää vapaat paikat alusta. */
$('paikat').addEventListener('dragover', e => e.preventDefault());
$('paikat').addEventListener('drop', e => {
  e.preventDefault();
  const eka = BIISIT.findIndex((b, i) => i < PAIKKOJA && (!b || !b.nimi));
  pudota(eka < 0 ? 0 : eka, e.dataTransfer.files);
});
/* Selain avaisi muuten pudotetun tiedoston koko sivuna. */
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => e.preventDefault());

$('paikatAuki').addEventListener('click', e => {
  const auki = $('paikat').classList.toggle('piilossa') === false;
  e.currentTarget.classList.toggle('on', auki);
  if (auki) paivitaRuudukko();
});
$('paikatKiinni').addEventListener('click', () => {
  $('paikat').classList.add('piilossa');
  $('paikatAuki').classList.remove('on');
});

window.addEventListener('resize', () => { clearTimeout(window.__t); window.__t = setTimeout(piirra, 150); });

/* ====================  äänenvoimakkuus  =================================
   Nuppi on pieni, koska laitteessa se on pieni. Puhelimessa napautus
   nostaa ison säätimen keskelle; hiirellä nuppia vedetään paikallaan.
   Mekanismi on jaetussa soitin.js:ssä, joten jokainen tuleva soitin saa
   saman eleen ilman omaa toteutusta. */

function paivitaAani(){
  const el2 = $('aani');
  if (el2) el2.querySelector('.osoitin').style.transform =
    'rotate(' + (-135 + aaniTaso * 270).toFixed(1) + 'deg)';
  const a = $('aaniArvo');
  if (a) a.textContent = Math.round(aaniTaso * 100) + ' %';
  if (el2) el2.setAttribute('aria-valuenow', Math.round(aaniTaso * 100));
  if (el) el.volume = aaniTaso;
}

(function kytkeAani(){
  /* iOS ei anna säätää elementin voimakkuutta ohjelmallisesti. Nuppi joka ei
     tee mitään on pahempi kuin puuttuva nuppi, joten se piilotetaan ja
     tilalle tulee rivi joka kertoo missä säädin on. */
  if (!voimakkuuttaVoiSaataa()){
    const n = $('aani');
    if (n) n.style.display = 'none';
    const s = document.querySelector('#ohjaus .selite');
    if (s) s.innerHTML = '<b>Volume</b><span>use the phone buttons</span>';
    return;
  }
  paivitaAani();
  if (!window.Saadin || !$('aani')) return;
  Saadin.lisaa({
    id: 'aani', nimi: 'Volume', el: $('aani'),
    min: 0, max: 1, askel: 0.01,
    lue: () => aaniTaso,
    aseta: v => { aaniTaso = v; paivitaAani(); },
    piirra: paivitaAani,
    muotoile: v => Math.round(v * 100) + ' %'
  });
})();

/* Biisilista myös palkista, ei vain kortin napautuksesta. */
(function kytkeLista(){
  const b = $('listaAuki');
  if (b && typeof avaaLista === 'function') b.addEventListener('click', avaaLista);
})();

(function kytkeKuljetus(){
  const e = $('edel'), s = $('seur'), n = $('soitaNappi');
  if (e) e.addEventListener('click', () => siirry(-1));
  if (s) s.addEventListener('click', () => siirry(1));
  if (n) n.addEventListener('click', () => {
    /* Ennen ensimmäistä valintaa soittonappi aloittaa ensimmäisestä
       biisistä. Ehto katsoo VALINTAA eikä äänielementtiä: elementti on
       olemassa heti sivun avauduttua, joten pelkkä sen tarkistus jätti
       napin tekemättä mitään ennen kuin listasta oli valittu jotain. */
    if (S.valittu < 0 || !el){
      siirry(1);
      return;
    }
    if (S.soi){ el.pause(); }
    else { el.play().catch(() => {}); }
  });
  /* Tila voi muuttua muualtakin - lukitusnäytöstä, raidan loppumisesta,
     puhelun keskeytyksestä - joten napit seuraavat elementtiä eivätkä
     vain omia painalluksiaan. */
  document.addEventListener('play',  paivitaKuljetus, true);
  document.addEventListener('pause', paivitaKuljetus, true);
  document.addEventListener('ended', paivitaKuljetus, true);
  paivitaKuljetus();
})();
$('valot').classList.add('on');
/* Jaettavaan tiedostoon leivotut biisit otetaan käyttöön ennen ensimmäistä
   piirtoa, jotta kone näyttää heti täydeltä. */
if (window.JB_UPOTETUT && Array.isArray(window.JB_UPOTETUT)){
  lataaUpotetut(window.JB_UPOTETUT);
  paivitaRuudukko();
}
paivitaNapit();
requestAnimationFrame(askel);

/* Julkaistulla sivulla setti.json?v=3ddca494 on soittimen vieressä ja se ladataan
   itsestään. Paikallisena tiedostona fetch ei toimi eikä sen tarvitsekaan —
   silloin biisit raahataan paneeliin käsin. */
(function omaSetti(){
  if (window.JB_UPOTETUT) return;
  /* file:// ei salli fetchiä lainkaan, ja yritys jättäisi konsoliin virheen.
     Paikallisena tiedostona biisit raahataan paneeliin käsin. */
  if (location.protocol === 'file:') return;
  fetch('setti.json?v=3ddca494', { cache: 'no-cache' })
    .then(r => r.ok ? r.json() : null)
    .then(d => {
      if (!d) return;
      lataaPaketti(d, []);
      paivitaRuudukko();
      paivitaNapit();
      /* Työkalupalkki on rakentajan väline, ei kävijän. Se saa näkyviin
         lisäämällä osoitteen perään ?tyokalut. */
      if (!/[?&]tyokalut\b/.test(location.search)){
        const bar = $('bar'); if (bar) bar.style.display = 'none';
        const pnl = $('paikat'); if (pnl) pnl.classList.add('piilossa');
        document.body.style.paddingTop = '0';
      }
    })
    .catch(() => {});
})();
</script>
