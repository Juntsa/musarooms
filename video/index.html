<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Music Videos</title>
<meta name="theme-color" content="#2a1a0f">
<style>
/* Musa videot.

   Klipit ovat pystyssa ja alle minuutin, eli somemittaa. Siksi kuva saa
   ruudusta kaiken mita se voi saada, ja kehys on ohut - paksu kaappi
   nayttaisi komealta mutta jattaisi videolle postimerkin.

   Oven takaa paljastuu uritettu pahkinapuukaappi; sama puu ja messinki
   jatkuvat tassa, mutta vain kehyksena. */
:root{
  --puu:#4a2f1c; --puuTum:#241509; --puuVaal:#7a5433;
  --messinki:#c9a24e; --messinkiVaal:#eccb8a;
  --kerma:#f2e6d2; --himmea:#9b8569;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:radial-gradient(120% 70% at 50% 0%,#3a2516 0%,#120b06 70%),#120b06;
  color:var(--kerma);
  font:16px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  display:flex;flex-direction:column;align-items:center;
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  overflow:hidden;
}
h1{
  font-weight:800;font-size:11px;line-height:1;letter-spacing:.36em;
  text-transform:uppercase;color:#c3a271;margin:4px 0 7px;flex:0 0 auto;
}
#kaappi{
  flex:1 1 auto;min-height:0;width:min(100%,460px);
  display:flex;flex-direction:column;gap:7px;
}
/* Tila jonka kehys saa kayttoonsa. Kehyksen oma koko lasketaan
   JavaScriptissa klipin kuvasuhteesta: pelkka CSS ei osaa pitaa
   kuvasuhdetta JA mahtua kahteen suuntaan yhta aikaa - max-width
   kaventaa laatikkoa mutta jattaa korkeuden ennalleen. */
#tila{
  flex:1 1 auto;min-height:0;display:flex;
  align-items:center;justify-content:center;
}
#kehys{
  position:relative;border-radius:8px;padding:6px;
  background:linear-gradient(180deg,#5c3b22,#2e1c0e 60%,#1a0f06);
  box-shadow:0 1px 0 #7a5433 inset,0 -2px 0 #0c0704 inset,0 10px 30px #000a;
}
/* uritettu puu, kuten oven kaapissa */
#kehys::before{
  content:"";position:absolute;inset:0;border-radius:8px;pointer-events:none;
  background:repeating-linear-gradient(90deg,
    #ffffff0a 0 1px, #0000000f 1px 3px, transparent 3px 7px);
  opacity:.5;
}
#ruutu{
  position:relative;width:100%;height:100%;border-radius:4px;overflow:hidden;
  background:#000;box-shadow:0 0 0 1px #0a0603,0 0 0 2px var(--messinki);
  display:flex;align-items:center;justify-content:center;
}
video{
  width:100%;height:100%;object-fit:contain;display:block;background:#000;
}
#peite{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:#0006;cursor:pointer;border:0;padding:0;
}
#peite.piilossa{display:none}
#peite svg{width:72px;height:72px;filter:drop-shadow(0 3px 10px #000b)}
#palkki{
  position:absolute;left:0;right:0;bottom:0;height:3px;background:#ffffff26;
}
#palkki i{display:block;height:100%;width:0;background:var(--messinkiVaal)}

#kilpi{
  display:block;width:100%;border:0;min-height:44px;
  border-radius:5px;padding:7px 28px 7px 10px;
  background:linear-gradient(180deg,#c9a24e,#8a6a2c);
  box-shadow:0 1px 0 #eccb8a inset,0 2px 6px #0007;
  color:#2a1a0f;text-align:center;
}
#kilpi b{
  display:block;font:700 14px/1.2 Georgia,"Times New Roman",serif;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
#kilpi span{
  display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  margin-top:2px;opacity:.75;
}
#kilpi{cursor:pointer}
#kilpi::after{
  content:"BROWSE";position:absolute;right:10px;top:50%;
  transform:translateY(-50%);
  font-weight:700;font-size:8px;line-height:1;letter-spacing:.14em;
  opacity:.5;
}
#kilpiKuori{position:relative;flex:0 0 auto}

/* Klippilista. Nousee alhaalta kuten dekin BROWSE; samaa sukua, jotta
   talo tuntuu yhdelta talolta. */
#lista{
  position:fixed;left:0;right:0;bottom:0;z-index:5;
  max-height:72vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:linear-gradient(180deg,#2e1c0e,#1a0f06);
  border-top:2px solid var(--messinki);
  box-shadow:0 -10px 30px #000b;
  transform:translateY(102%);transition:transform .22s ease;
  padding-bottom:calc(6px + env(safe-area-inset-bottom));
}
#lista.auki{transform:translateY(0)}
#listaOtsikko{
  position:sticky;top:0;display:flex;align-items:center;gap:8px;
  padding:8px 10px;background:#1a0f06;border-bottom:1px solid #4a2f1c;
}
#listaOtsikko b{
  flex:1;font-weight:700;font-size:10px;line-height:1;letter-spacing:.24em;
  color:#c3a271;text-transform:uppercase;
}
#listaKiinni{
  min-width:44px;min-height:34px;cursor:pointer;border-radius:5px;
  color:var(--kerma);background:#3a2516;border:1px solid #0c0704;
}
#lista ol{list-style:none;margin:0;padding:0}
#lista button.rivi{
  display:flex;align-items:center;gap:10px;width:100%;min-height:46px;
  cursor:pointer;text-align:left;padding:6px 10px;
  color:var(--kerma);background:transparent;border:0;
  border-bottom:1px solid #ffffff12;
}
#lista button.rivi[aria-current="true"]{background:#ffffff14}
#lista .nro{
  flex:0 0 auto;width:22px;text-align:right;
  font-size:11px;color:var(--himmea);
}
#lista .nimet{flex:1;min-width:0}
#lista .nimet b{
  display:block;font-weight:600;font-size:13px;line-height:1.25;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
#lista .nimet span{display:block;font-size:10px;color:var(--himmea)}
#lista .kesto{flex:0 0 auto;font-size:11px;color:var(--himmea)}

#napit{display:flex;gap:6px;flex:0 0 auto}
#napit button{
  flex:1;min-height:46px;cursor:pointer;border-radius:6px;
  font-weight:700;font-size:12px;letter-spacing:.1em;
  color:var(--kerma);background:linear-gradient(180deg,#4a2f1c,#2a1a0f);
  border:1px solid #0c0704;
}
#napit button:disabled{opacity:.4;cursor:default}
#nyt{
  flex:0 0 auto;text-align:center;font-size:12px;color:#9b8569;
  min-height:17px;padding-top:2px;
}
</style>

<body>
<h1>Musa videot</h1>

<div id="kaappi">
  <div id="tila"><div id="kehys">
    <div id="ruutu">
      <video id="video" playsinline preload="metadata"></video>
      <button id="peite" type="button" aria-label="Toista">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="30" fill="#1a0f06cc" stroke="#c9a24e" stroke-width="2"/>
          <path d="M26 20l20 12-20 12z" fill="#eccb8a"/>
        </svg>
      </button>
      <div id="palkki"><i id="palkkiTays"></i></div>
    </div>
  </div></div>

  <div id="kilpiKuori">
    <button type="button" id="kilpi" aria-label="Choose a clip">
      <b id="nimi">—</b><span id="alanimi"></span>
    </button>
  </div>

  <div id="napit">
    <button type="button" id="edel">&#9664;&#9664;</button>
    <button type="button" id="soita">PLAY</button>
    <button type="button" id="seur">&#9654;&#9654;</button>
  </div>

  <div id="nyt">no videos</div>
</div>

<div id="lista" aria-hidden="true">
  <div id="listaOtsikko">
    <b>Clips</b>
    <button type="button" id="listaKiinni">Close</button>
  </div>
  <ol id="listaRivit"></ol>
</div>

<script>
'use strict';
var $ = function (id){ return document.getElementById(id); };

var VIDEOT = [];
var kohta = -1;
var soi = false;
var v = $('video');

/* Ei Web Audiota eika varjosoitinta: video pysahtyy taustalla kaikissa
   selaimissa, ja niin kuuluukin - katsoja ei katso videota taskusta. */

function mmss(s){
  if (!isFinite(s) || s < 0) return '0:00';
  var m = Math.floor(s / 60), x = Math.floor(s % 60);
  return m + ':' + (x < 10 ? '0' : '') + x;
}

/* --- kuvaruudun mitoitus ---------------------------------------------
   Klipit tulevat kolmessa muodossa: pysty 9:16, vaaka 16:9 ja nelio.
   Kehys otetaan sen kokoiseksi kuin kuva on, ei toisin pain. Suhde
   tulee luettelosta, jotta ruutu on oikean muotoinen jo kansikuvan
   aikana eika hyppaa kun videon metadata saapuu.                      */
var KEHYS = 6;                                   // puukehyksen leveys px

function suhde(){
  var b = VIDEOT[kohta];
  if (b && b.leveys && b.korkeus) return b.leveys / b.korkeus;
  if (v.videoWidth && v.videoHeight) return v.videoWidth / v.videoHeight;
  return 9 / 16;
}

function mitoita(){
  var tila = $('tila');
  var lev = tila.clientWidth, kor = tila.clientHeight;
  if (!lev || !kor) return;
  var s = suhde();
  /* Sisamitta on se joka noudattaa kuvasuhdetta; kehys tulee paalle. */
  var sl = lev - 2 * KEHYS, sk = kor - 2 * KEHYS;
  if (sl <= 0 || sk <= 0) return;
  if (sl / sk > s) sl = sk * s;                  // tilaa liikaa leveyteen
  else sk = sl / s;                              // tilaa liikaa korkeuteen
  var e = $('kehys');
  e.style.width  = Math.floor(sl + 2 * KEHYS) + 'px';
  e.style.height = Math.floor(sk + 2 * KEHYS) + 'px';
}
window.addEventListener('resize', mitoita);
v.addEventListener('loadedmetadata', mitoita);

function valitse(i, aloita){
  if (!VIDEOT.length) return;
  kohta = ((i % VIDEOT.length) + VIDEOT.length) % VIDEOT.length;
  var b = VIDEOT[kohta];
  soi = false;
  v.pause();
  v.src = b.video;
  if (b.kansi) v.poster = b.kansi;
  else v.removeAttribute('poster');
  v.load();
  $('peite').classList.remove('piilossa');
  $('palkkiTays').style.width = '0%';
  mediaTiedot(b);
  mitoita();
  merkitseLista();
  paivita();
  if (aloita) toista(true);
}

function toista(paalle){
  if (!v.src) return;
  if (paalle === undefined) paalle = v.paused;
  if (paalle){
    v.play().then(function (){
      soi = true; $('peite').classList.add('piilossa'); paivita();
    }).catch(function (){ soi = false; paivita(); });
  } else {
    v.pause(); soi = false; $('peite').classList.remove('piilossa'); paivita();
  }
}

v.addEventListener('ended', function (){
  soi = false;
  $('peite').classList.remove('piilossa');
  /* Yksi klippi kerrallaan: seuraavaan siirrytaan vasta kun katsoja
     pyytaa. Automaattinen vieritys on somen tapa, ei huoneen. */
  paivita();
});
v.addEventListener('play',  function (){ soi = true;  mediaTila('playing'); paivita(); });
v.addEventListener('pause', function (){ soi = false; mediaTila('paused');  paivita(); });
v.addEventListener('timeupdate', function (){
  if (!v.duration) return;
  $('palkkiTays').style.width =
    (Math.max(0, Math.min(1, v.currentTime / v.duration)) * 100).toFixed(2) + '%';
  $('nyt').textContent = mmss(v.currentTime) + ' / ' + mmss(v.duration);
});

function paivita(){
  var b = VIDEOT[kohta];
  $('nimi').textContent = b ? b.nimi : '—';
  $('alanimi').textContent = b ? (b.alarivi || '') : '';
  $('soita').textContent = soi ? 'PAUSE' : 'PLAY';
  $('soita').disabled = !VIDEOT.length;
  $('edel').disabled = VIDEOT.length < 2;
  $('seur').disabled = VIDEOT.length < 2;
  if (!VIDEOT.length) $('nyt').textContent = 'no videos';
  else if (!soi && !v.currentTime)
    $('nyt').textContent = (kohta + 1) + ' / ' + VIDEOT.length;
}

/* --- klippilista -----------------------------------------------------
   Nimet tulevat tiedostonimista, eli kayttajan syotteesta. Rivin runko
   on HTML, mutta nimi ja alarivi asetetaan textContent-arvoina - sama
   linjaus kuin asemien nimissa ja house-soittimessa.                   */
function teeLista(){
  var ol = $('listaRivit');
  ol.textContent = '';
  for (var i = 0; i < VIDEOT.length; i++){
    var b = VIDEOT[i];
    var li = document.createElement('li');
    var nap = document.createElement('button');
    nap.type = 'button';
    nap.className = 'rivi';
    nap.setAttribute('data-kohta', String(i));

    var nro = document.createElement('span');
    nro.className = 'nro';
    nro.textContent = String(i + 1);

    var nimet = document.createElement('span');
    nimet.className = 'nimet';
    var vahva = document.createElement('b');
    vahva.textContent = b.nimi || '';
    nimet.appendChild(vahva);
    if (b.alarivi){
      var ala = document.createElement('span');
      ala.textContent = b.alarivi;
      nimet.appendChild(ala);
    }

    var kesto = document.createElement('span');
    kesto.className = 'kesto';
    kesto.textContent = mmss(b.kesto || 0);

    nap.appendChild(nro); nap.appendChild(nimet); nap.appendChild(kesto);
    li.appendChild(nap);
    ol.appendChild(li);
  }
}

function listaAuki(auki){
  var e = $('lista');
  if (auki === undefined) auki = !e.classList.contains('auki');
  e.classList.toggle('auki', auki);
  e.setAttribute('aria-hidden', auki ? 'false' : 'true');
  if (auki){
    var nyt = e.querySelector('[aria-current="true"]');
    if (nyt) nyt.scrollIntoView({ block: 'center' });
  }
}

function merkitseLista(){
  var rivit = $('listaRivit').querySelectorAll('button.rivi');
  for (var i = 0; i < rivit.length; i++){
    if (i === kohta) rivit[i].setAttribute('aria-current', 'true');
    else rivit[i].removeAttribute('aria-current');
  }
}

$('listaRivit').addEventListener('click', function (e){
  var nap = e.target.closest ? e.target.closest('button.rivi') : null;
  if (!nap) return;
  listaAuki(false);
  valitse(parseInt(nap.getAttribute('data-kohta'), 10), false);
});
$('kilpi').addEventListener('click', function (){
  if (VIDEOT.length) listaAuki();
});
$('listaKiinni').addEventListener('click', function (){ listaAuki(false); });

function mediaTiedot(b){
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.metadata = new window.MediaMetadata({
      title: b && b.nimi ? b.nimi : 'Musa videot',
      artist: b && b.alarivi ? b.alarivi : 'KJWhispers',
      album: 'Musa Rooms · Videot'
    });
  } catch (e){}
  var k = {
    play: function (){ toista(true); },
    pause: function (){ toista(false); },
    previoustrack: function (){ valitse(kohta - 1, false); },
    nexttrack: function (){ valitse(kohta + 1, false); }
  };
  for (var nimi in k){
    try { navigator.mediaSession.setActionHandler(nimi, k[nimi]); }
    catch (e){}
  }
}
function mediaTila(t){
  if (!('mediaSession' in navigator)) return;
  try { navigator.mediaSession.playbackState = t; } catch (e){}
}

$('peite').addEventListener('click', function (){ toista(true); });
$('soita').addEventListener('click', function (){ toista(); });
$('edel').addEventListener('click', function (){ valitse(kohta - 1, false); });
$('seur').addEventListener('click', function (){ valitse(kohta + 1, false); });
$('ruutu').addEventListener('click', function (e){
  if (e.target === v && soi) toista(false);
});
document.addEventListener('keydown', function (e){
  if (e.key === ' '){ toista(); e.preventDefault(); }
  else if (e.key === 'ArrowRight'){ valitse(kohta + 1, false); e.preventDefault(); }
  else if (e.key === 'ArrowLeft'){ valitse(kohta - 1, false); e.preventDefault(); }
});

(function hae(){
  paivita();
  if (location.protocol === 'file:') return;
  fetch('videot.json?v=d6a2e579', { cache: 'no-cache' })
    .then(function (r){ return r.ok ? r.json() : null; })
    .then(function (d){
      if (!d || !Array.isArray(d.videot) || !d.videot.length) return;
      VIDEOT = d.videot;
      teeLista();
      valitse(0, false);
    })
    .catch(function (){});
})();
</script>

<style>
.musa-paluu{position:fixed;left:10px;top:10px;z-index:9000;
 width:44px;height:44px;border-radius:50%;
 border:1px solid rgba(255,235,200,.3);background:rgba(10,9,8,.62);
 color:#f0e4d2;display:flex;align-items:center;justify-content:center;
 -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.musa-paluu:active{background:rgba(10,9,8,.85)}
.musa-paluu[hidden]{display:none}
</style>
<script>
/* Aulan oma peite piirtää paluunapin kehyksen päälle, joten kehyksen
   SISÄLLÄ tämä olisi toinen samannäköinen nappi vierekkäin. Piilotetaan
   se silloin — mutta vain silloin. Suoraan huoneen osoitteeseen tullut
   kävijä (linkki, kirjanmerkki, hakutulos, sivun päivitys) ei ole
   kehyksessä eikä pääsisi muuten mihinkään. */
(function (){
  try {
    if (window.self !== window.top){
      var n = document.querySelector('.musa-paluu');
      if (n) n.hidden = true;
    }
  } catch (e){ /* eri alkuperä: ollaan kehyksessä, mutta varmuuden
                  vuoksi nappi jää näkyviin — turha nappi on parempi
                  kuin umpikuja */ }
})();
</script>
