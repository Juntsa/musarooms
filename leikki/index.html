<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leikkihuone</title>
<meta name="theme-color" content="#3f1116">
<style>
/* Leikkihuoneen soitin.
   Nelivuotias ei lue pientä tekstiä eikä osu pieneen nappiin. Siksi:
   nimet isoina, rivit sormenkokoisina, kolme valikkoa ja kolme nappia.
   Ei nuppeja, ei liukuja, ei asetuksia. */
:root{
  --puna:#d4383f; --punaTum:#8d1220; --punaVaal:#ea5a62;
  --kerma:#fdf3e0; --ruskea:#6b4426; --vihrea:#4e8f3c;
  --siemen:#f5d969; --teksti:#4a2418;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:radial-gradient(120% 90% at 50% 0%,#5e1a22 0%,#2a0a0e 70%),#2a0a0e;
  color:var(--kerma);
  font:16px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  display:flex;flex-direction:column;align-items:center;
  padding:10px 10px calc(10px + env(safe-area-inset-bottom));
  overflow:hidden;
}
h1{
  font:800 15px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.3em;
  text-transform:uppercase;color:#ffd7a8;margin:4px 0 8px;flex:0 0 auto;
}

/* ---- mansikka ---------------------------------------------------- */
#mansikka{
  position:relative;flex:1 1 auto;min-height:0;
  width:min(100%,440px);display:flex;flex-direction:column;
}
#kuori{position:absolute;inset:0;z-index:0}
#kuori svg{width:100%;height:100%;display:block}

/* sisältö marjan päälle */
/* Marjan pitaa nakya sisallon ympari, muuten se on vain punainen tausta.
   Siksi lista ei venyta itseaan taydelle korkeudelle vaan jattaa olkapaat
   ylos ja karjen alas. */
#sisus{
  position:relative;z-index:1;flex:1 1 auto;min-height:0;
  display:flex;flex-direction:column;align-items:center;
  padding:20% 15% 15%;
}

/* ---- kolme valikkoa ---------------------------------------------- */
#valikot{display:flex;gap:6px;flex:0 0 auto;width:100%;margin-bottom:11px}
#valikot button{
  flex:1 1 0;min-height:52px;border:0;border-radius:13px;cursor:pointer;
  background:rgba(60,14,18,.42);color:#ffe7c4;
  font:700 13px/1.15 "Segoe UI",system-ui,sans-serif;letter-spacing:.02em;
  padding:6px 2px;
  box-shadow:inset 0 0 0 2px rgba(255,220,180,.3);
}
#valikot button[aria-selected="true"]{
  background:var(--kerma);color:var(--punaTum);
  box-shadow:0 3px 10px rgba(0,0,0,.4);
}

/* ---- laululista --------------------------------------------------- */
#lista{
  flex:0 0 46%;width:100%;min-height:0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--kerma);border-radius:16px;padding:7px;
  box-shadow:inset 0 2px 8px rgba(109,52,24,.28);
}
#lista button{
  display:flex;align-items:center;gap:10px;width:100%;
  min-height:60px;margin:0 0 6px;padding:8px 12px;
  border:0;border-radius:12px;background:#fff9ee;cursor:pointer;text-align:left;
  box-shadow:0 1px 0 rgba(109,52,24,.16);
}
#lista button:last-child{margin-bottom:0}
#lista button .nro{
  flex:0 0 auto;width:34px;height:34px;border-radius:50%;
  background:var(--puna);color:#fff;
  font:800 16px/34px "Segoe UI",sans-serif;text-align:center;
}
#lista button .nimi{
  flex:1 1 auto;min-width:0;
  font:700 19px/1.2 "Segoe UI",system-ui,sans-serif;color:var(--teksti);
}
#lista button .nimi i{
  display:block;font:400 13px/1.3 "Segoe UI",sans-serif;
  color:#8a6a52;font-style:normal;margin-top:2px;
}
#lista button[aria-current="true"]{background:#ffe9a8}
#lista button[aria-current="true"] .nro{background:var(--vihrea)}
#tyhja{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;gap:8px;color:#8a6a52;text-align:center;padding:18px;
}
#tyhja b{font:700 18px/1.3 "Segoe UI",sans-serif;color:var(--teksti)}
#tyhja span{font-size:14px;max-width:24ch}

/* ---- napit -------------------------------------------------------- */
#napit{
  flex:1 1 auto;display:flex;gap:14px;justify-content:center;align-items:center;
  width:82%;
}
#napit button{
  width:62px;height:62px;border-radius:50%;border:0;cursor:pointer;
  background:linear-gradient(180deg,#fff7e8,#e8cfa8);
  box-shadow:0 4px 0 #a8773f,0 7px 12px rgba(0,0,0,.4);
  display:flex;align-items:center;justify-content:center;
  color:var(--punaTum);
}
#napit button:active{transform:translateY(3px);box-shadow:0 1px 0 #a8773f}
#napit #soita{
  width:82px;height:82px;
  background:linear-gradient(180deg,#8fd46f,#3f7a30);color:#fff;
  box-shadow:0 5px 0 #2a5620,0 9px 16px rgba(0,0,0,.45);
}
#napit #soita:active{transform:translateY(4px);box-shadow:0 1px 0 #2a5620}
#napit button svg{width:28px;height:28px;fill:currentColor}
#napit #soita svg{width:38px;height:38px}
#napit button[disabled]{opacity:.4}

/* ---- alapalkki ----------------------------------------------------- */
#ala{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  width:min(100%,440px);padding:8px 4px 0;
}
#nyt{
  flex:1 1 auto;min-width:0;color:#ffd7a8;font-size:13px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#kyla{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;
  min-height:44px;padding:0 14px;border-radius:22px;text-decoration:none;
  background:rgba(253,243,224,.14);color:#ffe7c4;
  font:600 13px/1 "Segoe UI",sans-serif;
  box-shadow:inset 0 0 0 1px rgba(255,220,180,.32);
}
@media (max-height:620px){
  #sisus{padding:16% 13% 11%}
  #napit button{width:54px;height:54px}
  #napit #soita{width:70px;height:70px}
  #lista button{min-height:54px}
  #lista button .nimi{font-size:17px}
}
</style>

<body>

<h1>Leikkihuone</h1>

<div id="mansikka">
  <div id="kuori" aria-hidden="true"></div>
  <div id="sisus">
    <div id="valikot" role="tablist">
      <button role="tab" data-ryhma="toimintalaulut" aria-selected="true">Toiminta&shy;laulut</button>
      <button role="tab" data-ryhma="unilaulut" aria-selected="false">Uni&shy;laulut</button>
      <button role="tab" data-ryhma="iloiset" aria-selected="false">Iloiset</button>
    </div>
    <div id="lista" role="tabpanel"></div>
    <div id="napit">
      <button id="edel" type="button" aria-label="Edellinen laulu">
        <svg viewBox="0 0 24 24"><path d="M6 5h3v14H6zM20 5v14l-11-7z"/></svg>
      </button>
      <button id="soita" type="button" aria-label="Soita">
        <svg viewBox="0 0 24 24"><path d="M7 4l14 8-14 8z"/></svg>
      </button>
      <button id="seur" type="button" aria-label="Seuraava laulu">
        <svg viewBox="0 0 24 24"><path d="M18 5h-3v14h3zM4 5v14l11-7z"/></svg>
      </button>
    </div>
  </div>
</div>

<div id="ala">
  <span id="nyt">Valitse laulu</span>
  <a id="kyla" href="https://mansikkakyla.fi/" rel="noopener">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
      <path d="M12 21c-5-3.4-8-6.9-8-10.5C4 7 6.6 5 9.4 5c1.1 0 2 .4 2.6 1 .6-.6 1.5-1 2.6-1C17.4 5 20 7 20 10.5 20 14.1 17 17.6 12 21z"/>
    </svg>
    Mansikkakylä
  </a>
</div>

<script>
/* ====================  marjan kuori  =================================
   Piirretään kerran SVG:nä taustalle. Teksti jää HTML:ksi, jotta se
   pysyy terävänä ja ruudunlukija löytää sen. */
(function kuori(){
  const S = [];
  S.push('<svg viewBox="0 0 440 620" preserveAspectRatio="none"'
       + ' xmlns="http://www.w3.org/2000/svg">');
  S.push('<defs><radialGradient id="mg" cx="36%" cy="26%" r="78%">'
       + '<stop offset="0" stop-color="#ea5a62"/>'
       + '<stop offset=".55" stop-color="#d4383f"/>'
       + '<stop offset="1" stop-color="#8d1220"/></radialGradient></defs>');
  /* marjan runko: leveä ylhäältä, kapenee kärjeksi */
  const marja = 'M220,92 C96,92 24,176 24,292 C24,420 120,540 220,600 '
              + 'C320,540 416,420 416,292 C416,176 344,92 220,92 Z';
  S.push('<path d="' + marja + '" fill="#6e0d18"/>');
  S.push('<path d="' + marja + '" fill="url(#mg)" transform="translate(0 -5)"/>');
  /* kiiltoraita */
  S.push('<path d="M92,210 C70,268 76,348 106,408" fill="none" stroke="#ff9aa0"'
       + ' stroke-width="26" stroke-linecap="round" opacity=".38"/>');
  /* siemenet riveittäin, kapenevat alaspäin */
  const rivit = [[150,7,152],[196,7,150],[242,6,136],[288,6,120],
                 [334,5,100],[380,4,76],[422,3,52],[462,2,30]];
  for (const [y, n, lev] of rivit){
    for (let i = 0; i < n; i++){
      const x = 220 + (n === 1 ? 0 : (i - (n - 1) / 2) * (lev * 2 / (n - 1)));
      const kier = (x - 220) * 0.07;
      S.push('<ellipse cx="' + x.toFixed(1) + '" cy="' + y + '" rx="6.5" ry="9"'
           + ' fill="#f5d969" transform="rotate(' + kier.toFixed(1)
           + ' ' + x.toFixed(1) + ' ' + y + ')"/>');
    }
  }
  /* lehtikruunu ja varsi */
  for (const [dx, kulma] of [[-128,-34],[-70,-16],[0,0],[70,16],[128,34]]){
    S.push('<path d="M0,0 C-34,-34 -84,-40 -98,-16 C-70,-2 -32,6 0,0 Z"'
         + ' fill="#4e8f3c" transform="translate(' + (220 + dx) + ' 96) rotate('
         + (kulma + 180) + ')"/>');
  }
  S.push('<path d="M0,0 C-30,-28 -72,-34 -84,-14 C-60,-2 -28,5 0,0 Z"'
       + ' fill="#3f7a30" transform="translate(220 104) rotate(200)"/>');
  S.push('<rect x="208" y="34" width="24" height="60" rx="12" fill="#5c8f3a"/>');
  S.push('</svg>');
  document.getElementById('kuori').innerHTML = S.join('');
})();

/* ====================  laulut  ======================================= */
const $ = id => document.getElementById(id);
const RYHMAT = ['toimintalaulut', 'unilaulut', 'iloiset'];
let LAULUT = { toimintalaulut: [], unilaulut: [], iloiset: [] };
let ryhma = 'toimintalaulut';
let kohta = -1;
let soi = false;

const el = new Audio();
el.preload = 'none';
el.playsInline = true;

function nykyinen(){ return LAULUT[ryhma] || []; }

/* Lukitusnäytön ohjaimet. Soitto jatkuu näytön sammuttua, koska tämä soitin
   soittaa elementillä suoraan eikä Web Audion läpi — mutta ilman
   MediaSessionia lapsi ei näe lukitusnäytöltä mikä laulu soi eivätkä
   kuulokkeiden napit toimi. */
function mediaTiedot(b){
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.metadata = new window.MediaMetadata({
      title: b && b.nimi ? b.nimi : 'Leikkihuone',
      artist: b && b.alarivi ? b.alarivi : 'Musa Rooms',
      album: 'Leikkihuone'
    });
  } catch (e){}
  const k = {
    play: () => { el.play().then(() => { soi = true; piirraLista(); })
                           .catch(() => {}); },
    pause: () => { el.pause(); soi = false; piirraLista(); },
    previoustrack: () => valitse(kohta <= 0 ? -1 : kohta - 1),
    nexttrack: () => valitse(kohta + 1)
  };
  for (const nimi in k){
    try { navigator.mediaSession.setActionHandler(nimi, k[nimi]); }
    catch (e){}
  }
}

el.addEventListener('play', () => {
  if ('mediaSession' in navigator)
    try { navigator.mediaSession.playbackState = 'playing'; } catch (e){}
});
el.addEventListener('pause', () => {
  if ('mediaSession' in navigator)
    try { navigator.mediaSession.playbackState = 'paused'; } catch (e){}
});

function piirraLista(){
  const l = nykyinen(), p = $('lista');
  if (!l.length){
    p.innerHTML = '<div id="tyhja"><b>Täällä ei ole vielä lauluja</b>'
                + '<span>Ne tulevat pian. Kurkista sillä välin Mansikkakylään.</span></div>';
    paivitaNapit();
    return;
  }
  p.innerHTML = '';
  l.forEach((b, i) => {
    const n = document.createElement('button');
    n.type = 'button';
    n.setAttribute('aria-current', i === kohta ? 'true' : 'false');
    n.innerHTML = '<span class="nro">' + (i + 1) + '</span><span class="nimi">'
                + teksti(b.nimi) + (b.alarivi ? '<i>' + teksti(b.alarivi) + '</i>' : '')
                + '</span>';
    n.addEventListener('click', () => valitse(i));
    p.appendChild(n);
  });
  paivitaNapit();
}

/* Laulujen nimet tulevat tiedostoista, joten ne käsitellään tekstinä
   eikä merkkauksena. */
function teksti(s){
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function paivitaNapit(){
  const l = nykyinen();
  $('edel').disabled = l.length < 2;
  $('seur').disabled = l.length < 2;
  $('soita').disabled = !l.length;
  $('soita').innerHTML = soi
    ? '<svg viewBox="0 0 24 24"><path d="M6 4h5v16H6zM13 4h5v16h-5z"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M7 4l14 8-14 8z"/></svg>';
  $('soita').setAttribute('aria-label', soi ? 'Tauko' : 'Soita');
  const b = l[kohta];
  $('nyt').textContent = b ? (soi ? '▶ ' : '❚❚ ') + b.nimi : 'Valitse laulu';
}

function valitse(i){
  const l = nykyinen();
  if (!l.length) return;
  kohta = (i + l.length) % l.length;
  const b = l[kohta];
  el.src = b.aani;
  el.load();
  mediaTiedot(b);
  /* play() hylätään hiljaa jos sitä kutsuu ennen kuin elementti on
     valmis — sama ansa kuin jukeboksissa ja SilverDeckissä. */
  const aloita = () => el.play().then(() => { soi = true; piirraLista(); })
                               .catch(() => { soi = false; piirraLista(); });
  if (el.readyState >= 2) aloita();
  else el.addEventListener('canplay', aloita, { once: true });
  piirraLista();
}

$('soita').addEventListener('click', () => {
  if (!nykyinen().length) return;
  if (kohta < 0){ valitse(0); return; }
  if (soi){ el.pause(); soi = false; }
  else { el.play().then(() => { soi = true; piirraLista(); }).catch(() => {}); }
  paivitaNapit();
});
$('edel').addEventListener('click', () => valitse(kohta <= 0 ? -1 : kohta - 1));
$('seur').addEventListener('click', () => valitse(kohta + 1));
el.addEventListener('ended', () => {
  if (nykyinen().length > 1) valitse(kohta + 1);
  else { soi = false; paivitaNapit(); }
});
el.addEventListener('pause', () => { soi = false; paivitaNapit(); });
el.addEventListener('play',  () => { soi = true;  paivitaNapit(); });

document.querySelectorAll('#valikot button').forEach(n => {
  n.addEventListener('click', () => {
    document.querySelectorAll('#valikot button').forEach(m =>
      m.setAttribute('aria-selected', m === n ? 'true' : 'false'));
    ryhma = n.dataset.ryhma;
    kohta = -1;
    el.pause();
    soi = false;
    piirraLista();
  });
});

/* ====================  lataus  ======================================= */
(function lataa(){
  piirraLista();
  if (location.protocol === 'file:') return;
  fetch('laulut.json?v=9385a2f3', { cache: 'no-cache' })
    .then(r => r.ok ? r.json() : null)
    .then(d => {
      if (!d || !d.ryhmat) return;
      RYHMAT.forEach(k => { LAULUT[k] = Array.isArray(d.ryhmat[k]) ? d.ryhmat[k] : []; });
      /* Avataan se valikko jossa on lauluja, ettei huone näytä tyhjältä
         vaikka viereisessä olisi koko setti. */
      const eka = RYHMAT.find(k => LAULUT[k].length);
      if (eka && !LAULUT[ryhma].length){
        ryhma = eka;
        document.querySelectorAll('#valikot button').forEach(m =>
          m.setAttribute('aria-selected', m.dataset.ryhma === eka ? 'true' : 'false'));
      }
      piirraLista();
    })
    .catch(() => {});
})();
</script>

<a class="musa-paluu" href="../" aria-label="Takaisin aulaan">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
 stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
 aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg></a>
<style>
.musa-paluu{position:fixed;left:10px;top:10px;z-index:9000;
 width:44px;height:44px;border-radius:50%;
 border:1px solid rgba(255,235,200,.3);background:rgba(10,9,8,.62);
 color:#f0e4d2;display:flex;align-items:center;justify-content:center;
 -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.musa-paluu:active{background:rgba(10,9,8,.85)}
.musa-paluu[hidden]{display:none}
</style>
<script>
/* Aulan oma peite piirtää paluunapin kehyksen päälle, joten kehyksen
   SISÄLLÄ tämä olisi toinen samannäköinen nappi vierekkäin. Piilotetaan
   se silloin — mutta vain silloin. Suoraan huoneen osoitteeseen tullut
   kävijä (linkki, kirjanmerkki, hakutulos, sivun päivitys) ei ole
   kehyksessä eikä pääsisi muuten mihinkään. */
(function (){
  try {
    if (window.self !== window.top){
      var n = document.querySelector('.musa-paluu');
      if (n) n.hidden = true;
    }
  } catch (e){ /* eri alkuperä: ollaan kehyksessä, mutta varmuuden
                  vuoksi nappi jää näkyviin — turha nappi on parempi
                  kuin umpikuja */ }
})();
</script>
